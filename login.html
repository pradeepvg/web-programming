<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Smart Home Expense & Maintenance Tracker</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="width: 52px; height: 52px; font-size: 1.5rem;">🏡</div>
      <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">Welcome Back</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">Sign in to manage your household expenses and maintenance</p>
    </div>

    <!-- Demo Credentials Box -->
    <div class="demo-credentials-box">
      <div style="font-weight: 700; color: var(--teal-light); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;">
        <span>⚡ Quick Demo Credentials</span>
        <button type="button" onclick="fillDemo()" style="background: none; border: none; color: var(--teal-light); font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 0.78rem;">Auto-Fill</button>
      </div>
      <div><strong>Email:</strong> rahul.sharma@example.in</div>
      <div><strong>Password:</strong> demo123</div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="password">Password</label>
        </div>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
        Sign In to SmartHome
      </button>
    </form>

    <div style="text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
      Don't have an account yet? <a href="register.html" style="color: var(--teal-light); font-weight: 600;">Create Household Account</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    if (API.getToken()) {
      window.location.href = 'dashboard.html';
    }

    function fillDemo() {
      document.getElementById('email').value = 'rahul.sharma@example.in';
      document.getElementById('password').value = 'demo123';
      showToast('Demo credentials filled!', 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!email || !password) {
        showToast('Please enter both email and password', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const res = await API.login(email, password);
        API.setToken(res.token);
        API.setUser({
          id: res.userId,
          name: res.name,
          email: res.email,
          currency: res.currency || 'INR'
        });
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to SmartHome';
      }
    }
  </script>
</body>
</html>
