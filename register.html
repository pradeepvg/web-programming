<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Household Account - Smart Home Tracker</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 500px;">
    <div class="auth-header">
      <div class="brand-icon" style="width: 52px; height: 52px; font-size: 1.5rem;">🏡</div>
      <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary);">Create Household Account</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">Set up your home tracking profile in Indian Rupees (₹)</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group" style="margin-bottom: 14px;">
        <label for="name">Homeowner / Member Name *</label>
        <input type="text" id="name" class="form-control" placeholder="e.g. Priya & Amit Verma" required>
      </div>

      <div class="form-group" style="margin-bottom: 14px;">
        <label for="email">Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="priya.verma@example.in" required>
      </div>

      <div class="form-row" style="margin-bottom: 14px;">
        <div class="form-group">
          <label for="password">Password (min 6 chars) *</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 98765 00000">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="address">Household Address</label>
        <input type="text" id="address" class="form-control" placeholder="Flat / Villa, Society, City, Pincode">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
        Register & Enter Dashboard
      </button>
    </form>

    <div style="text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
      Already have an account? <a href="login.html" style="color: var(--teal-light); font-weight: 600;">Sign In here</a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    if (API.getToken()) {
      window.location.href = 'dashboard.html';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!name || !email || !password) {
        showToast('Please fill all required fields', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Creating account...';

      try {
        const res = await API.register({ name, email, password, phone, address });
        API.setToken(res.token);
        API.setUser({
          id: res.userId,
          name: res.name,
          email: res.email,
          currency: res.currency || 'INR'
        });
        showToast('Registration successful! Welcome!', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Register & Enter Dashboard';
      }
    }
  </script>
</body>
</html>
